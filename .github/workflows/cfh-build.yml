name: CFH Search Windows verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test and build search engine
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
      - name: Generate third-party license inventory
        shell: pwsh
        run: |
          $url='https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-pc-windows-msvc.tar.gz'
          Invoke-WebRequest "$url" -OutFile "$env:RUNNER_TEMP\about.tar.gz"
          Invoke-WebRequest "$url.sha256" -OutFile "$env:RUNNER_TEMP\about.sha256"
          $expected=((Get-Content "$env:RUNNER_TEMP\about.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash "$env:RUNNER_TEMP\about.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'License tool checksum mismatch' }
          tar -xzf "$env:RUNNER_TEMP\about.tar.gz" -C "$env:RUNNER_TEMP"
          $about=Get-ChildItem "$env:RUNNER_TEMP" -Filter cargo-about.exe -Recurse | Select-Object -First 1
          if (-not $about) { throw 'License tool missing' }
          & $about.FullName about generate about.hbs -o THIRD-PARTY.txt
          if ($LASTEXITCODE -ne 0 -or !(Test-Path THIRD-PARTY.txt)) { throw 'License inventory failed' }
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $iss=@"
          [Setup]
          AppId=CFHSearch
          AppName=CFH Search
          AppVersion=0.1.0
          AppPublisher=Coders for Humanity
          DefaultDirName={localappdata}\Programs\CFH Search
          DefaultGroupName=CFH Search
          PrivilegesRequired=lowest
          OutputDir=$env:RUNNER_TEMP\installer
          OutputBaseFilename=CFH-Search-Setup
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "$env:GITHUB_WORKSPACE\target\release\rg.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\CFH-Search.ps1"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\CFH-Search.cmd"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\CFH-FORK.md"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\LICENSE-MIT"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\UNLICENSE"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\COPYING"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$env:GITHUB_WORKSPACE\THIRD-PARTY.txt"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\CFH Search"; Filename: "{app}\CFH-Search.cmd"
          "@
          $iss | Set-Content "$env:RUNNER_TEMP\search.iss" -Encoding utf8
          iscc "$env:RUNNER_TEMP\search.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install and test search interface
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:RUNNER_TEMP\installed"
          $p=Start-Process "$env:RUNNER_TEMP\installer\CFH-Search-Setup.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          foreach($name in @('rg.exe','CFH-Search.ps1','CFH-Search.cmd','CFH-FORK.md','LICENSE-MIT','UNLICENSE','COPYING','THIRD-PARTY.txt')) { if (!(Test-Path "$dir\$name")) { throw "Installed file missing: $name" } }
          $testFolder="$env:RUNNER_TEMP\search test folder"; New-Item -ItemType Directory -Force $testFolder | Out-Null
          [IO.File]::WriteAllText("$testFolder\sample.txt",'A real needle is here')
          $app=Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"`"$dir\CFH-Search.ps1`"") -PassThru
          try {
            Add-Type @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NativeSearchTest {
            public delegate bool Callback(IntPtr h, IntPtr p);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls,string title);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,Callback c,IntPtr p);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder s,int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder s,int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h,int msg,IntPtr w,string l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h,int msg,IntPtr w,StringBuilder l);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h,int msg,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
            public static List<IntPtr> Children(IntPtr h) { var list=new List<IntPtr>(); EnumChildWindows(h,(x,p)=>{ list.Add(x); return true; },IntPtr.Zero); return list; }
            public static string Class(IntPtr h) { var b=new StringBuilder(256); GetClassName(h,b,b.Capacity); return b.ToString(); }
            public static string Text(IntPtr h) { var b=new StringBuilder(1000002); SendMessage(h,13,(IntPtr)b.Capacity,b); return b.ToString(); }
            public static void Set(IntPtr h,string s) { SendMessage(h,12,IntPtr.Zero,s); }
            public static void Click(IntPtr h) { SendMessage(h,245,IntPtr.Zero,IntPtr.Zero); }
          }
          "@
            $window=[IntPtr]::Zero
            for($i=0;$i -lt 30;$i++) { if($app.HasExited){throw 'App exited during startup'}; $window=[NativeSearchTest]::FindWindow($null,'CFH Search'); if($window -ne [IntPtr]::Zero){break}; Start-Sleep -Seconds 1 }
            if($window -eq [IntPtr]::Zero){throw 'Search form missing'}
            $children=[NativeSearchTest]::Children($window)
            $edits=@($children | Where-Object { [NativeSearchTest]::Class($_) -match 'EDIT' })
            $buttons=@($children | Where-Object { [NativeSearchTest]::Class($_) -match 'BUTTON' })
            $button=$buttons | Where-Object { [NativeSearchTest]::Text($_) -eq 'Search' } | Select-Object -First 1
            if($edits.Count -ne 3 -or -not $button) { throw "Unexpected controls: edits=$($edits.Count), buttons=$($buttons.Count)" }
            $folder=$edits[0]; $query=$edits[1]; $output=$edits[2]
            [NativeSearchTest]::Set($folder,$testFolder); [NativeSearchTest]::Set($query,'needle'); [NativeSearchTest]::Click($button)
            function Wait-Search { for($i=0;$i -lt 60;$i++) { Start-Sleep -Seconds 1; if([NativeSearchTest]::IsWindowEnabled($button)) { return } }; throw 'Search did not finish' }
            Wait-Search
            if([NativeSearchTest]::Text($output) -notmatch 'sample\.txt:1:A real needle is here'){ throw 'Expected GUI search result missing' }
            [IO.File]::WriteAllText("$testFolder\long.txt", ('needle' + ('x' * 1200000)))
            [NativeSearchTest]::Click($button); Wait-Search
            $value=[NativeSearchTest]::Text($output)
            if($value.Length -gt 1000000 -or $value.Length -lt 999000){ throw "Output cap failed: $($value.Length)" }
            $texts=@($children | ForEach-Object { [NativeSearchTest]::Text($_) })
            if($texts -notcontains 'Search finished; results limited to 1 million characters.'){ throw 'Truncation notice missing' }
            [NativeSearchTest]::Set($folder,"$testFolder\missing"); [NativeSearchTest]::Click($button)
            $texts=@($children | ForEach-Object { [NativeSearchTest]::Text($_) })
            if($texts -notcontains 'Choose an existing folder.'){ throw 'Invalid-folder feedback missing' }
            [NativeSearchTest]::Set($folder,$testFolder); [NativeSearchTest]::Set($query,'nothing matches this query 735'); [NativeSearchTest]::Click($button); Wait-Search
            $texts=@($children | ForEach-Object { [NativeSearchTest]::Text($_) })
            if($texts -notcontains 'No matches found.'){ throw 'No-match recovery failed' }
            Write-Output 'LARGE LINE BOUND AND ERROR RECOVERY VERIFIED'
            Write-Output 'INSTALLED GUI SEARCH VERIFIED'
          } finally { if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force } }
          $uninstaller=Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          if(-not $uninstaller) { throw 'Uninstaller missing' }
          $p=Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if($p.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Upload unsigned installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cfh-search-installer-unsigned
          path: ${{ runner.temp }}\installer\CFH-Search-Setup.exe
          if-no-files-found: error