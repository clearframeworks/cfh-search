name: CFH Search candidate dependency assessment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a642f711421a5561d6e2c7f6f8f59c70050ea4fb
          persist-credentials: false
      - name: Install OSV Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Audit exact candidate dependencies
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source --recursive .